services:
  backend:
    build:
      context: ./backend
    container_name: enterprise_erp_backend
    environment:
      DATABASE_URL: sqlite:///./erp.db
      SECRET_KEY: change-me-for-local-demo
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    command: sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: enterprise_erp_frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
